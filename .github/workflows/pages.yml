name: Validate and deploy SpatialForge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check studio.js
          node --check architecture/model-asset-store.js
          node --check architecture/model-runtime.js
          node --check document-import.js
      - name: Run unit and contract tests
        run: node --test tests/*.test.mjs
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real browser integration tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spatialforge-browser-traces
          path: test-results/
          retention-days: 7
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package static site
        run: |
          mkdir -p _site/architecture
          cp index.html studio.js document-import.js evidence-compiler.js visual-contract.js spatial-renderer.js _site/
          cp architecture/model-runtime.js architecture/annotation-layout.js architecture/model-asset-store.js _site/architecture/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
